<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Ditch setup cheat sheet diagram</title>
  <desc id="desc">Three compact ditch shape examples for 1 to 1, 1 to 1.5 and 1 to 2 side slopes with profile range notes.</desc>

  <defs>
    <style>
      .bg { fill: #f7f8fa; }
      .card { fill: #ffffff; stroke: #d0d7de; stroke-width: 1.2; }
      .axis { stroke: #586069; stroke-width: 1.4; }
      .centerline { stroke: #005f99; stroke-width: 2.2; stroke-dasharray: 6 5; }
      .slope { stroke: #b54708; stroke-width: 2.4; }
      .mirror { stroke: #1f6feb; stroke-width: 2.4; }
      .label { font: 14px 'Segoe UI', 'Arial', sans-serif; fill: #24292f; }
      .small { font: 12px 'Segoe UI', 'Arial', sans-serif; fill: #57606a; }
      .title { font: 20px 'Segoe UI', 'Arial', sans-serif; fill: #0b3a66; font-weight: 700; }
      .subtitle { font: 13px 'Segoe UI', 'Arial', sans-serif; fill: #4b5563; }
      .chip { fill: #eef6ff; stroke: #9ecbff; stroke-width: 1; }
      .chipText { font: 12px 'Segoe UI', 'Arial', sans-serif; fill: #0b3a66; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1200" height="420" />

  <text class="title" x="32" y="38">Ditch setup quick diagram</text>
  <text class="subtitle" x="32" y="60">Use with the README table: side + distance + slope + profile range</text>

  <g transform="translate(30,90)">
    <rect class="card" x="0" y="0" width="360" height="290" rx="10" />
    <text class="label" x="18" y="28">Preset A: 1:1</text>
    <line class="axis" x1="50" y1="220" x2="310" y2="220" />
    <line class="centerline" x1="180" y1="70" x2="180" y2="220" />
    <line class="slope" x1="180" y1="220" x2="245" y2="155" />
    <line class="mirror" x1="180" y1="220" x2="115" y2="155" />
    <text class="small" x="194" y="208">+1 side</text>
    <text class="small" x="80" y="208">-1 side</text>
    <text class="small" x="234" y="146">dist 2.0, slope -1.0</text>
    <text class="small" x="18" y="255">Example rule codes: 1.1 and -1.1</text>
    <rect class="chip" x="18" y="264" width="145" height="20" rx="8"/>
    <text class="chipText" x="27" y="278">profiles 1-10</text>
  </g>

  <g transform="translate(420,90)">
    <rect class="card" x="0" y="0" width="360" height="290" rx="10" />
    <text class="label" x="18" y="28">Preset B: 1:1.5</text>
    <line class="axis" x1="50" y1="220" x2="310" y2="220" />
    <line class="centerline" x1="180" y1="70" x2="180" y2="220" />
    <line class="slope" x1="180" y1="220" x2="270" y2="160" />
    <line class="mirror" x1="180" y1="220" x2="90" y2="160" />
    <text class="small" x="232" y="150">dist 3.0, slope -0.667</text>
    <text class="small" x="18" y="255">Example rule codes: 1.5 and -1.5</text>
    <rect class="chip" x="18" y="264" width="185" height="20" rx="8"/>
    <text class="chipText" x="27" y="278">profiles 11-20 (example)</text>
  </g>

  <g transform="translate(810,90)">
    <rect class="card" x="0" y="0" width="360" height="290" rx="10" />
    <text class="label" x="18" y="28">Preset C: 1:2</text>
    <line class="axis" x1="50" y1="220" x2="310" y2="220" />
    <line class="centerline" x1="180" y1="70" x2="180" y2="220" />
    <line class="slope" x1="180" y1="220" x2="295" y2="162" />
    <line class="mirror" x1="180" y1="220" x2="65" y2="162" />
    <text class="small" x="225" y="150">dist 4.0, slope -0.5</text>
    <text class="small" x="18" y="246">Optional stop layer:</text>
    <text class="small" x="18" y="262">material rock/moist/constructiontc</text>
    <text class="small" x="18" y="278">slot 0-9 mapped to surface name</text>
  </g>
</svg>
